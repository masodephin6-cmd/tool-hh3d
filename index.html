<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Auto Luyện Đan (Có Proxy)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #111827; color: #f3f4f6; padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: #1f2937; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #374151; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #111827; color: white; border: 1px solid #4b5563; border-radius: 5px; box-sizing: border-box;}
        button { background: #3b82f6; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;}
        button:hover { background: #2563eb; }
        .btn-run { background: #10b981; } .btn-stop { background: #ef4444; } .btn-del { background: #6b7280; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border: 1px solid #374151; text-align: left; }
        th { background: #111827; color: #9ca3af; }
        .log-container { background: #000; border: 1px solid #374151; border-radius: 5px; padding: 10px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 13px; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px dotted #333; padding-bottom: 3px; }
        .log-time { color: #9ca3af; margin-right: 10px; }
        .log-acc { color: #60a5fa; font-weight: bold; margin-right: 10px; }
        .log-msg.info { color: #d1d5db; } .log-msg.success { color: #10b981; } .log-msg.warning { color: #fbbf24; } .log-msg.error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚗️ Auto Luyện Đan (Vượt Cloudflare bằng Proxy)</h2>
        <div style="color: #fbbf24; margin-bottom: 15px; font-weight: bold;">⚠️ Giữ tab này mở để tool chạy. Nếu tắt trình duyệt tool sẽ dừng!</div>

        <!-- Khung thêm tài khoản -->
        <div class="card">
            <h3>Thêm / Cập Nhật Tài Khoản</h3>
            <input type="text" id="accName" placeholder="Tên gợi nhớ (VD: Acc Phụ 1)">
            <input type="text" id="domain" value="https://hoathinh3d.so" placeholder="Tên miền">
            <input type="text" id="proxyStr" placeholder="Proxy định dạng: ip:port:user:pass (Bỏ trống nếu không dùng)">
            <textarea id="cookieJson" rows="3" placeholder="Dán định dạng JSON Cookie vào đây..."></textarea>
            <button onclick="saveAccount()">Lưu Tài Khoản</button>
        </div>

        <!-- Khung quản lý tài khoản -->
        <div class="card">
            <h3>Danh Sách Account</h3>
            <table>
                <thead><tr><th>Tên Acc & Proxy</th><th>Trạng Thái Ngắn</th><th>Thao tác</th></tr></thead>
                <tbody id="accList"></tbody>
            </table>
        </div>

        <!-- Khung Bảng Logs -->
        <div class="card">
            <h3>Bảng Logs Hoạt Động <button onclick="clearLogs()" style="float: right; padding: 5px 10px; font-size: 11px; background: #4b5563;">Xóa Logs</button></h3>
            <div id="logContainer" class="log-container"></div>
        </div>
    </div>

    <script>
        let loops = {};
        let tokens = {};
        const logBox = document.getElementById('logContainer');

        function addLog(accName, message, type = 'info') {
            const now = new Date();
            const logHTML = `<div class="log-entry"><span class="log-time">[${now.toLocaleTimeString()}]</span><span class="log-acc">[${accName}]</span><span class="log-msg ${type}">${message}</span></div>`;
            logBox.insertAdjacentHTML('beforeend', logHTML);
            logBox.scrollTop = logBox.scrollHeight;
            const shortStatus = document.getElementById('status_' + accName);
            if (shortStatus) shortStatus.innerHTML = `<span class="log-msg ${type}">${message}</span>`;
        }

        function clearLogs() { logBox.innerHTML = ''; addLog('Hệ thống', 'Đã xóa log.', 'info'); }

        function parseCookie(jsonStr) {
            try {
                let parsed = JSON.parse(jsonStr);
                let arr = parsed.cookies ? parsed.cookies : parsed;
                return arr.map(c => `${c.name}=${c.value}`).join('; ');
            } catch(e) { return null; }
        }

        function saveAccount() {
            const name = document.getElementById('accName').value;
            let domain = document.getElementById('domain').value.trim();
            const proxyConfig = document.getElementById('proxyStr').value.trim();
            const cookieStr = parseCookie(document.getElementById('cookieJson').value);

            if(!name || !cookieStr) return alert("Vui lòng nhập Tên và Cookie JSON hợp lệ!");

            if (domain.includes('/luyen-dan-duong')) domain = domain.replace('/luyen-dan-duong', '');
            domain = domain.replace(/\/$/, "");
            if (!domain.startsWith('http')) domain = 'https://' + domain;

            let accounts = JSON.parse(localStorage.getItem('hh3d_accs') || '{}');
            accounts[name] = { domain, cookieStr, proxyConfig };
            localStorage.setItem('hh3d_accs', JSON.stringify(accounts));
            
            addLog('Hệ thống', `Đã lưu: ${name} (Proxy: ${proxyConfig ? proxyConfig.split(':')[0] : 'Không dùng'})`, 'success');
            document.getElementById('accName').value = '';
            document.getElementById('cookieJson').value = '';
            renderList();
        }

        async function callProxy(targetUrl, method, headers, payload, proxyConfig) {
            const res = await fetch('/.netlify/functions/proxy', {
                method: 'POST',
                body: JSON.stringify({ targetUrl, method, headers, payload, proxyConfig })
            });
            return await res.json();
        }

        // ... (các phần khác giữ nguyên)

async function runAuto(accName) {
    const accs = JSON.parse(localStorage.getItem('hh3d_accs') || '{}');
    const acc = accs[accName];
    if(!acc) return;

    addLog(accName, 'Đang gửi lệnh vượt Cloudflare...', 'info');

    // Mẹo: Nếu web hiện "Just a moment", bạn hãy lấy Cookie bằng extension "EditThisCookie" 
    // đảm bảo trong JSON Cookie có dòng cf_clearance.
    
    // Logic gọi API của bạn...
    // (Giữ nguyên logic gọi callProxy ở câu trước)
}
        function stopAuto(accName) { if (loops[accName]) clearInterval(loops[accName]); delete loops[accName]; addLog(accName, 'Đã DỪNG.', 'warning'); renderList(); }
        function startAuto(accName) { if (!loops[accName]) runAuto(accName); }
        function deleteAcc(accName) { stopAuto(accName); let accs = JSON.parse(localStorage.getItem('hh3d_accs')||'{}'); delete accs[accName]; localStorage.setItem('hh3d_accs', JSON.stringify(accs)); addLog('Hệ thống', `Đã xóa tài khoản: ${accName}`, 'info'); renderList(); }

        function renderList() {
            const accs = JSON.parse(localStorage.getItem('hh3d_accs') || '{}');
            let html = '';
            for (let name in accs) {
                const isRunning = !!loops[name];
                const proxyIP = accs[name].proxyConfig ? accs[name].proxyConfig.split(':')[0] : 'Không dùng (IP Netlify)';
                html += `<tr>
                    <td><b>${name}</b><br><small style="color:#9ca3af">Proxy: ${proxyIP}</small></td>
                    <td id="status_${name}" style="font-size: 13px;">${isRunning ? '<span style="color:#10b981">Đang chạy...</span>' : '<span style="color:#ef4444">Đã dừng</span>'}</td>
                    <td>
                        ${isRunning ? `<button class="btn-stop" onclick="stopAuto('${name}')">Dừng</button>` : `<button class="btn-run" onclick="startAuto('${name}')">Chạy</button>`}
                        <button class="btn-del" onclick="deleteAcc('${name}')">Xóa</button>
                    </td>
                </tr>`;
            }
            document.getElementById('accList').innerHTML = html;
        }
        renderList();
        addLog('Hệ thống', 'Giao diện tải thành công. Sẵn sàng hoạt động.', 'success');
    </script>
</body>
</html>
