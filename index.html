<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Auto Luyện Đan trên Trình Duyệt</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #111827; color: #f3f4f6; padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: #1f2937; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #374151; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #111827; color: white; border: 1px solid #4b5563; border-radius: 5px; box-sizing: border-box;}
        button { background: #3b82f6; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;}
        button:hover { background: #2563eb; }
        .btn-run { background: #10b981; } .btn-stop { background: #ef4444; } .btn-del { background: #6b7280; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border: 1px solid #374151; text-align: left; }
        th { background: #111827; color: #9ca3af; }
        
        /* CSS cho bảng Logs */
        .log-container {
            background: #000;
            border: 1px solid #374151;
            border-radius: 5px;
            padding: 10px;
            height: 300px;
            overflow-y: auto; /* Cho phép cuộn */
            font-family: monospace; /* Font chữ kiểu terminal */
            font-size: 13px;
        }
        .log-entry { margin-bottom: 5px; border-bottom: 1px dotted #333; padding-bottom: 3px; }
        .log-time { color: #9ca3af; margin-right: 10px; }
        .log-acc { color: #60a5fa; font-weight: bold; margin-right: 10px; }
        .log-msg.info { color: #d1d5db; }
        .log-msg.success { color: #10b981; }
        .log-msg.warning { color: #fbbf24; }
        .log-msg.error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚗️ Auto Luyện Đan (Chạy Trực Tiếp Trên Web)</h2>
        <div style="color: #fbbf24; margin-bottom: 15px; font-weight: bold;">⚠️ Phải mở tab này để tool chạy. Đóng tab là tool dừng!</div>

        <!-- Khung thêm tài khoản -->
        <div class="card">
            <h3>Thêm / Cập Nhật Tài Khoản</h3>
            <input type="text" id="accName" placeholder="Tên gợi nhớ (VD: Acc Phụ 1)">
            <input type="text" id="domain" value="[https://hoathinh3d.so](https://hoathinh3d.so)" placeholder="Tên miền">
            <textarea id="cookieJson" rows="3" placeholder="Dán định dạng JSON Cookie vào đây..."></textarea>
            <button onclick="saveAccount()">Lưu Tài Khoản</button>
        </div>

        <!-- Khung quản lý tài khoản -->
        <div class="card">
            <h3>Danh Sách Account</h3>
            <table>
                <thead>
                    <tr>
                        <th>Tên Acc</th>
                        <th>Trạng Thái Ngắn</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="accList"></tbody>
            </table>
        </div>

        <!-- Khung Bảng Logs Chi Tiết -->
        <div class="card">
            <h3>Bảng Logs Hoạt Động <button onclick="clearLogs()" style="float: right; padding: 5px 10px; font-size: 11px; background: #4b5563;">Xóa Logs</button></h3>
            <div id="logContainer" class="log-container">
                <!-- Logs sẽ hiển thị ở đây -->
            </div>
        </div>
    </div>

   <script>
        let loops = {};
        let tokens = {};
        const logBox = document.getElementById('logContainer');

        function addLog(accName, message, type = 'info') {
            const now = new Date();
            const timeStr = now.toLocaleTimeString(); 
            const logHTML = `
                <div class="log-entry">
                    <span class="log-time">[${timeStr}]</span>
                    <span class="log-acc">[${accName}]</span>
                    <span class="log-msg ${type}">${message}</span>
                </div>
            `;
            logBox.insertAdjacentHTML('beforeend', logHTML);
            logBox.scrollTop = logBox.scrollHeight;
            
            const shortStatus = document.getElementById('status_' + accName);
            if (shortStatus) shortStatus.innerHTML = `<span class="log-msg ${type}">${message}</span>`;
        }

        function clearLogs() {
            logBox.innerHTML = '';
            addLog('Hệ thống', 'Đã xóa lịch sử log.', 'info');
        }

        function parseCookie(jsonStr) {
            try {
                let parsed = JSON.parse(jsonStr);
                let arr = parsed.cookies ? parsed.cookies : parsed;
                return arr.map(c => `${c.name}=${c.value}`).join('; ');
            } catch(e) { return null; }
        }

        function saveAccount() {
            const name = document.getElementById('accName').value;
            const domain = document.getElementById('domain').value.replace(/\/$/, "");
            const cookieStr = parseCookie(document.getElementById('cookieJson').value);

            if(!name || !cookieStr) return alert("Vui lòng nhập Tên và JSON Cookie hợp lệ!");

            let accounts = JSON.parse(localStorage.getItem('hh3d_accs') || '{}');
            accounts[name] = { domain, cookieStr };
            localStorage.setItem('hh3d_accs', JSON.stringify(accounts));
            
            addLog('Hệ thống', `Đã lưu tài khoản: ${name}`, 'success');
            document.getElementById('accName').value = '';
            document.getElementById('cookieJson').value = '';
            renderList();
        }

        // Gọi API qua Proxy
        async function callProxy(targetUrl, method, headers, payload) {
            const res = await fetch('/.netlify/functions/proxy', {
                method: 'POST',
                body: JSON.stringify({ targetUrl, method, headers, payload })
            });
            return await res.json();
        }

        async function runAuto(accName) {
            const accs = JSON.parse(localStorage.getItem('hh3d_accs') || '{}');
            const acc = accs[accName];
            if(!acc) return;

            addLog(accName, 'Bắt đầu khởi động auto...', 'info');
            tokens[accName] = { nonce: "", token: "" };

            loops[accName] = setInterval(async () => {
                // ĐẦY ĐỦ HEADERS ĐỂ VƯỢT CLOUDFLARE
                const baseHeaders = { 
                    "cookie": acc.cookieStr, 
                    "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                    "accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
                    "accept-language": "vi-VN,vi;q=0.9,en-US;q=0.8,en;q=0.7",
                    "sec-ch-ua": "\"Not_A Brand\";v=\"8\", \"Chromium\";v=\"120\", \"Google Chrome\";v=\"120\"",
                    "sec-ch-ua-mobile": "?0",
                    "sec-ch-ua-platform": "\"Windows\""
                };

                try {
                    // 1. Lấy Token
                    if (!tokens[accName].token) {
                        const pageRes = await callProxy(`${acc.domain}/luyen-dan-duong`, "GET", baseHeaders);
                        
                        // Kiểm tra nếu Proxy lỗi từ bên trong
                        if (!pageRes || !pageRes.success) {
                            addLog(accName, `Lỗi Proxy: ${pageRes?.error || 'Không nhận được dữ liệu'}`, 'error');
                            stopAuto(accName);
                            return;
                        }

                        const htmlText = pageRes.text || "";
                        
                        // Bắt lỗi rỗng hoặc bị chặn
                        if(htmlText.includes("Cloudflare") || htmlText.includes("Checking your browser")) {
                            addLog(accName, "Lỗi: Bị Cloudflare chặn. Hãy lấy lại Cookie mới (bao gồm cf_clearance)!", 'error');
                            stopAuto(accName); return;
                        }

                        const nonceMatch = htmlText.match(/"restNonce"\s*:\s*"([^"]+)"/);
                        const tokenMatch = htmlText.match(/"securityToken"\s*:\s*"([^"]+)"/);

                        if (nonceMatch && tokenMatch) {
                            tokens[accName].nonce = nonceMatch[1];
                            tokens[accName].token = tokenMatch[1];
                            addLog(accName, "Đã lấy Token thành công, bắt đầu vận công...", 'success');
                        } else {
                            addLog(accName, "Lỗi: Không tìm thấy Token. Cookie có thể đã chết hoặc sai định dạng!", 'error');
                            stopAuto(accName); 
                            return;
                        }
                    }

                    // Nếu đã có token thì chạy logic chính
                    if (tokens[accName].token) {
                        const apiHeaders = { 
                            ...baseHeaders, 
                            "accept": "application/json",
                            "content-type": "application/json", 
                            "x-wp-nonce": tokens[accName].nonce, 
                            "x-ld-token": tokens[accName].token,
                            "referer": `${acc.domain}/luyen-dan-duong`,
                            "origin": acc.domain
                        };

                        const stateRes = await callProxy(`${acc.domain}/wp-json/hh3d/v1/luyen-dan/state`, "GET", apiHeaders);
                        
                        if(!stateRes.success) {
                            addLog(accName, "Lỗi kết nối tới API Luyện Đan", 'error');
                            return;
                        }

                        let stateData;
                        try {
                            stateData = JSON.parse(stateRes.text).data;
                        } catch(e) {
                            addLog(accName, "Lỗi: Server trả về dữ liệu không phải JSON", 'error');
                            return;
                        }
                        
                        if(!stateData) return;

                        const furnace = stateData.furnace || "idle";
                        const craftId = stateData.craft?.id;
                        
                        if (furnace === "idle") {
                            let hasBundle = false;
                            for (let b of (stateData.mat_bundles || [])) {
                                if (b.qty > 0) {
                                    hasBundle = true;
                                    addLog(accName, "Đang bóc túi nguyên liệu...", 'warning');
                                    await callProxy(`${acc.domain}/wp-json/hh3d/v1/luyen-dan/open-mat-bundle`, "POST", apiHeaders, { bundle_key: b.bundle_key });
                                    break;
                                }
                            }
                            
                            if (!hasBundle) {
                                const tier = stateData.tier || "trung";
                                addLog(accName, `Đang nhét nguyên liệu, đốt lò phẩm [${tier}]...`, 'info');
                                const startRes = await callProxy(`${acc.domain}/wp-json/hh3d/v1/luyen-dan/start`, "POST", apiHeaders, { tier });
                                
                                const resData = JSON.parse(startRes.text);
                                if(resData && !resData.ok) {
                                    addLog(accName, `Lỗi khởi động lò: ${resData.message || 'Thiếu nguyên liệu'}`, 'error');
                                }
                            }
                        } 
                        else if (furnace === "crafting") {
                            const stability = parseFloat(stateData.craft?.stability_pct);
                            const tuneCd = parseInt(stateData.craft?.tune_cooldown_left_sec);
                            
                            addLog(accName, `Lò đang cháy... Độ ổn định: ${stability}% | Chờ skill: ${tuneCd}s`, 'info');
                            
                            if (stability <= 68 && tuneCd === 0) {
                                addLog(accName, "🔥 Lửa tụt dưới 68%! Đang bơm Điều Hỏa...", 'warning');
                                await callProxy(`${acc.domain}/wp-json/hh3d/v1/luyen-dan/tune`, "POST", apiHeaders);
                            }
                        }
                        else if (furnace === "ready") {
                            addLog(accName, "🎁 Đan đã chín! Đang thu hoạch...", 'success');
                            await callProxy(`${acc.domain}/wp-json/hh3d/v1/luyen-dan/collect`, "POST", apiHeaders, { job_id: craftId });
                        }
                        else if (furnace === "exploded") {
                            addLog(accName, "💥 BÙM! Nổ lò rồi... Đang dọn dẹp.", 'error');
                            await callProxy(`${acc.domain}/wp-json/hh3d/v1/luyen-dan/ack-explosion`, "POST", apiHeaders, { job_id: craftId });
                        }
                    }

                } catch (err) {
                    addLog(accName, `Lỗi mạng: ${err.message}`, 'error');
                }
            }, 3000);
            
            renderList();
        }

        function stopAuto(accName) {
            if (loops[accName]) {
                clearInterval(loops[accName]);
                delete loops[accName];
                addLog(accName, 'Đã DỪNG.', 'warning');
            }
            renderList();
        }

        function startAuto(accName) {
            if (!loops[accName]) runAuto(accName);
        }

        function deleteAcc(accName) {
            stopAuto(accName);
            let accounts = JSON.parse(localStorage.getItem('hh3d_accs') || '{}');
            delete accounts[accName];
            localStorage.setItem('hh3d_accs', JSON.stringify(accounts));
            addLog('Hệ thống', `Đã xóa: ${accName}`, 'info');
            renderList();
        }

        function renderList() {
            const accs = JSON.parse(localStorage.getItem('hh3d_accs') || '{}');
            let html = '';
            for (let name in accs) {
                const isRunning = !!loops[name];
                html += `<tr>
                    <td><b>${name}</b></td>
                    <td id="status_${name}" style="font-size: 13px;">${isRunning ? '<span style="color:#10b981">Đang chạy...</span>' : '<span style="color:#ef4444">Đã dừng</span>'}</td>
                    <td>
                        ${isRunning 
                            ? `<button class="btn-stop" onclick="stopAuto('${name}')">Dừng</button>` 
                            : `<button class="btn-run" onclick="startAuto('${name}')">Chạy</button>`
                        }
                        <button class="btn-del" onclick="deleteAcc('${name}')">Xóa</button>
                    </td>
                </tr>`;
            }
            document.getElementById('accList').innerHTML = html;
        }

        renderList();
        addLog('Hệ thống', 'Sẵn sàng.', 'success');
    </script>
</body>
</html>
